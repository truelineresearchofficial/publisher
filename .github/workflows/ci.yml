name: ci-cd

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
      SHEETS_SYNC_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Validate migrations
        run: alembic upgrade head
      - name: Tests (unit + integration)
        run: pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
        env:
          VITE_API_BASE: /api

  deploy:
    needs: [backend-test, frontend-build]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via Coolify on trueline
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          APP_UUID: ${{ github.ref_name == 'main' && vars.COOLIFY_APP_MAIN || vars.COOLIFY_APP_DEV }}
          SITE_URL: ${{ github.ref_name == 'main' && vars.SITE_URL_MAIN || vars.SITE_URL_DEV }}
        if: ${{ env.COOLIFY_URL != '' }}
        run: |
          set -euo pipefail
          api() { curl -sS --fail-with-body --retry 3 --retry-delay 5 -H "Authorization: Bearer $COOLIFY_TOKEN" "$@"; }
          # Coolify builds the branch HEAD (docker-compose.coolify.yml) and restarts the stack
          resp=$(api -X POST "$COOLIFY_URL/api/v1/deploy?uuid=$APP_UUID")
          dep=$(echo "$resp" | jq -r '.deployments[0].deployment_uuid // empty')
          [ -n "$dep" ] || { echo "No deployment id in response: $resp"; exit 1; }
          echo "Coolify deployment $dep queued"
          status=queued
          for i in $(seq 1 90); do
            status=$(api "$COOLIFY_URL/api/v1/deployments/$dep" | jq -r .status)
            echo "status: $status"
            case "$status" in
              finished) break ;;
              failed|cancelled-by-user) echo "Deployment $status - see Coolify logs"; exit 1 ;;
            esac
            sleep 10
          done
          [ "$status" = finished ] || { echo "Timed out waiting for deployment $dep"; exit 1; }
          curl -fsS --retry 5 --retry-delay 5 "$SITE_URL/api/health"
